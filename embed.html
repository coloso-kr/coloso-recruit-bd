<!-- 콜로소 채용 공고 자동 리스트: iframe 없이 콘텐츠 높이에 자동 맞춤 -->
<style>
  #coloso-jobs,
  #coloso-jobs * { box-sizing: border-box; }

  #coloso-jobs {
    width: 100%;
    margin: 0;
    padding: 0;
    border-top: 1px solid rgba(255,255,255,.18);
    background: transparent;
    color: #fff;
    font-family: "Noto Sans KR", Arial, sans-serif;
  }

  #coloso-jobs .coloso-job {
    display: grid;
    grid-template-columns: minmax(0,1fr) auto;
    gap: 16px;
    align-items: center;
    width: 100%;
    margin: 0;
    padding: 14px 18px;
    border: 0;
    border-bottom: 1px solid rgba(255,255,255,.18);
    background: rgba(74,74,74,.22);
    color: inherit;
    text-decoration: none;
    transition: background-color .2s ease, border-color .2s ease;
  }

  #coloso-jobs .coloso-job:hover,
  #coloso-jobs .coloso-job:active {
    background: rgba(49,92,255,.18);
    border-bottom-color: #3d6bff;
  }

  #coloso-jobs .coloso-job-title {
    font-size: 15px;
    font-weight: 700;
    line-height: 1.4;
    word-break: keep-all;
  }

  #coloso-jobs .coloso-job-meta {
    margin-top: 4px;
    color: rgba(255,255,255,.5);
    font-size: 11px;
    line-height: 1.45;
  }

  #coloso-jobs .coloso-job-arrow {
    color: #3d6bff;
    font-size: 18px;
  }

  #coloso-jobs .coloso-job-status {
    margin: 0;
    padding: 18px;
    background: rgba(74,74,74,.2);
    color: rgba(255,255,255,.55);
    font-size: 13px;
    text-align: center;
  }

  @media (max-width:640px) {
    #coloso-jobs .coloso-job { padding: 13px 14px; }
    #coloso-jobs .coloso-job-title { font-size: 14px; }
    #coloso-jobs .coloso-job-meta { font-size: 10.5px; }
  }
</style>

<div id="coloso-jobs">
  <!-- FastComposer가 비동기 로딩 전에도 전체 목록 높이를 계산하도록 6줄을 먼저 확보 -->
  <div class="coloso-job coloso-job-placeholder"><div><div class="coloso-job-title">채용 중인 포지션을 불러오고 있습니다</div></div><span></span></div>
  <div class="coloso-job coloso-job-placeholder" aria-hidden="true"><div><div class="coloso-job-title">&nbsp;</div></div><span></span></div>
  <div class="coloso-job coloso-job-placeholder" aria-hidden="true"><div><div class="coloso-job-title">&nbsp;</div></div><span></span></div>
  <div class="coloso-job coloso-job-placeholder" aria-hidden="true"><div><div class="coloso-job-title">&nbsp;</div></div><span></span></div>
  <div class="coloso-job coloso-job-placeholder" aria-hidden="true"><div><div class="coloso-job-title">&nbsp;</div></div><span></span></div>
  <div class="coloso-job coloso-job-placeholder" aria-hidden="true"><div><div class="coloso-job-title">&nbsp;</div></div><span></span></div>
</div>

<script>
(() => {
  const root = document.getElementById('coloso-jobs');
  if (!root || root.dataset.loaded) return;
  root.dataset.loaded = 'true';

  const DATA = 'https://coloso-kr.github.io/coloso-recruit-bd/jobs.json';
  const CLICK = 'https://script.google.com/macros/s/AKfycbzn1MpbhJuVZCqnmzUXHj7VoBAxObbhlyA9X7PwI1rfdMRE64m6Ajdh17ySGxMvx8jLww/exec';
  const esc = value => String(value ?? '').replace(/[&<>"']/g, char => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  })[char]);

  let JOBS = [];

  fetch(DATA, { cache:'no-store' })
    .then(response => {
      if (!response.ok) throw new Error(String(response.status));
      return response.json();
    })
    .then(data => {
      const jobs = Array.isArray(data.jobs) ? data.jobs : [];
      JOBS = jobs;
      root.innerHTML = jobs.length
        ? jobs.map(job => `
          <a class="coloso-job"
             href="${esc(job.url)}"
             target="_blank"
             rel="noopener"
             data-id="${esc(job.id)}">
            <div>
              <div class="coloso-job-title">${esc(job.title)}</div>
              <div class="coloso-job-meta">${esc([job.group,job.task].filter(Boolean).join(' · '))}</div>
            </div>
            <span class="coloso-job-arrow">↗</span>
          </a>`).join('')
        : '<div class="coloso-job-status">현재 공개 중인 포지션이 없습니다</div>';
    })
    .catch(() => {
      root.innerHTML = '<div class="coloso-job-status">채용 공고를 불러오지 못했습니다</div>';
    });

  /*
   * 클릭 로그 전송
   *
   * sendBeacon은 요청을 렌더러가 아닌 브라우저 프로세스로 넘긴다.
   * 새 탭이 열려 이 페이지가 정지(suspend)돼도 전송이 완료된다.
   * 기존 트래킹 픽셀은 렌더러가 멈추면 함께 취소돼 모바일에서 누락됐다.
   */
  root.addEventListener('click', event => {
    const link = event.target.closest('.coloso-job');
    if (!link || !link.dataset.id) return;

    const job = JOBS.find(j => String(j.id) === link.dataset.id);
    if (!job) return;

    const payload = JSON.stringify({
      job_id: job.id,
      job_title: job.title,
      link_url: job.url,
      source: location.href,
      referrer: document.referrer || '',
      ua: navigator.userAgent
    });

    if (navigator.sendBeacon) {
      try {
        const blob = new Blob([payload], { type:'text/plain;charset=UTF-8' });
        if (navigator.sendBeacon(CLICK, blob)) return;
      } catch (error) { /* 폴백으로 진행 */ }
    }

    if (window.fetch) {
      fetch(CLICK, {
        method:'POST', body:payload, mode:'no-cors', keepalive:true,
        headers:{ 'Content-Type':'text/plain;charset=UTF-8' }
      }).catch(() => {});
      return;
    }

    new Image().src = CLICK
      + '?action=click&id=' + encodeURIComponent(job.id)
      + '&source=' + encodeURIComponent(location.href)
      + '&_=' + Date.now();
  });
})();
</script>
