<!-- 콜로소 홈페이지 직접 편집 영역에 삽입 -->
<div id="coloso-recruit-board">
  <iframe
    src="https://coloso-kr.github.io/coloso-recruit-bd/"
    title="콜로소 채용 중인 포지션"
    scrolling="no"
    loading="eager"
  ></iframe>
</div>

<style>
  #coloso-recruit-board { width:100%; margin:0; padding:0; overflow:hidden; }
  #coloso-recruit-board iframe { display:block; width:100%; height:80px; margin:0; padding:0; border:0; background:transparent; overflow:hidden; }
</style>

<script>
(() => {
  const frame = document.querySelector('#coloso-recruit-board iframe');
  if (!frame) return;
  window.addEventListener('message', event => {
    if (event.origin !== 'https://coloso-kr.github.io') return;
    if (event.data?.type !== 'coloso-recruit-height') return;
    const height = Math.max(0, Number(event.data.height) || 0);
    if (height) frame.style.height = height + 'px';
  });
})();
</script>
